<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f4d3a">
<title>Asrama STT Abdiel</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--tx:#1d2420;--mu:#68716b;--bd:#dedbd2;--ac:#1f4d3a;--onac:#fff;--in:#2f7d57;--out:#b4631a;--bad:#b3261e;--badbg:#fbe9e7}
@media(prefers-color-scheme:dark){:root{--bg:#121714;--card:#1a211d;--tx:#e7ece8;--mu:#97a39b;--bd:#2c3630;--ac:#7bc9a0;--onac:#0f1a14;--in:#7bc9a0;--out:#e8a35c;--bad:#ff8a80;--badbg:#3a1f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,"Times New Roman",serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}.wrap.wide{max-width:760px}
h1{font-size:1.5rem;margin:8px 0 2px}h2{font-size:1.05rem;margin:22px 0 8px}
.sub{color:var(--mu);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:12px}
label{display:block;font-size:.9rem;color:var(--mu);margin:12px 0 4px}
input,textarea{width:100%;padding:11px 12px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{font:inherit;font-weight:bold;width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:var(--ac);color:var(--onac);cursor:pointer}
button.ghost{background:none;color:var(--mu);font-weight:normal;width:auto;margin:0;padding:4px 0;text-decoration:underline}
button.mini{width:auto;margin:8px 0 0;padding:6px 10px;font-size:.85rem;font-weight:normal;background:none;color:var(--mu);border:1px solid var(--bd)}
button:disabled{opacity:.6}
.top{display:flex;justify-content:space-between;align-items:center}
.state{font-size:1.6rem;font-weight:bold;margin:4px 0}.in{color:var(--in)}.out{color:var(--out)}
.msg{padding:10px 12px;border-radius:8px;margin-bottom:12px;background:var(--card);border:1px solid var(--bd)}
.msg.err{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.row .nm{font-weight:bold}.row .meta{color:var(--mu);font-size:.9rem}.row .rt{text-align:right;font-size:.9rem;white-space:nowrap}
.late{border-color:var(--bad);border-left:5px solid var(--bad)}.late .rt{color:var(--bad);font-weight:bold}
.cnt{display:flex;gap:10px;margin-bottom:6px}.cnt div{flex:1}.cnt b{display:block;font-size:1.7rem}
.qrbox{background:#fff;padding:18px;border-radius:12px;display:flex;justify-content:center;margin:18px 0}
#reader{width:100%;border-radius:8px;overflow:hidden}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div id="msg"></div>

  <div id="vLogin" class="hide">
    <h1>Asrama STT Abdiel</h1>
    <p class="sub">Masuk dengan NIM dan PIN kamu.</p>
    <div class="card">
      <label for="nim">NIM</label><input id="nim" inputmode="numeric" autocomplete="username">
      <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
      <button id="bLogin">Masuk</button>
    </div>
  </div>

  <div id="vMhs" class="hide">
    <div class="top"><div><h1 id="mNama"></h1><p class="sub" id="mKamar"></p></div><button class="ghost" data-logout>Keluar akun</button></div>
    <div class="card"><div class="state" id="mState"></div><div class="sub" id="mInfo"></div></div>
    <div id="fScan">
      <button id="bScan">Scan QR di pos asrama</button>
      <div class="card hide" id="scanBox" style="margin-top:12px"><div id="reader"></div><button class="ghost" id="bStop" style="margin-top:10px">Batal</button></div>
    </div>
    <div class="card hide" id="fKeluar">
      <label for="alasan">Alasan keluar asrama</label>
      <textarea id="alasan" rows="3" placeholder="Contoh: Beli perlengkapan kuliah di kota"></textarea>
      <button id="bKeluar">Catat keluar</button>
    </div>
  </div>

  <div id="vAdmin" class="hide">
    <div class="top"><div><h1>Pantauan asrama</h1><p class="sub" id="aInfo"></p></div><button class="ghost" data-logout>Keluar akun</button></div>
    <button class="mini" id="bGate" style="margin:0 0 12px">Tampilkan QR gerbang</button>
    <div class="cnt">
      <div class="card"><b id="cLuar">0</b>Di luar</div>
      <div class="card"><b id="cTelat">0</b>Lewat jam malam</div>
      <div class="card"><b id="cIn">0</b>Di asrama</div>
    </div>
    <h2>Di luar asrama</h2><div id="lLuar"></div>
    <h2>Di asrama</h2><div id="lIn"></div>
  </div>

  <div id="vGate" class="hide" style="text-align:center">
    <h1>Scan untuk keluar atau masuk</h1>
    <p class="sub">QR berganti otomatis tiap 30 detik. Biarkan layar ini tetap terbuka.</p>
    <div class="qrbox"><div id="qr"></div></div>
    <p class="sub" id="gInfo"></p>
    <button class="ghost" id="bBack">Kembali ke dashboard</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
// ====== GANTI dengan URL web app Apps Script kamu (berakhiran /exec) ======
const API_URL = 'GANTI_DENGAN_URL_EXEC_APPS_SCRIPT';
// ==========================================================================

const params = new URLSearchParams(location.search);
const MODE = params.get('gerbang') ? 'gerbang' : '';
let scanTok = params.get('s') || '', pass = '', timer = null, reload = () => {}, scanner = null, busy = false;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(){ try { return localStorage.getItem('abdiel_token') || ''; } catch(e){ return window._tk || ''; } },
  set(v){ try { localStorage.setItem('abdiel_token', v); } catch(e){ window._tk = v; } },
  del(){ try { localStorage.removeItem('abdiel_token'); } catch(e){ window._tk = ''; } }
};
async function api(fn, ...args){
  let r;
  try { r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args }) }); }
  catch(e){ throw new Error('Tidak bisa terhubung ke server. Cek internet atau URL API.'); }
  let j; try { j = await r.json(); } catch(e){ throw new Error('Respons server tidak valid. Cek deployment Apps Script.'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function show(v){ ['vLogin','vMhs','vAdmin','vGate'].forEach(x => $(x).classList.toggle('hide', x !== v)); $('app').classList.toggle('wide', v === 'vAdmin'); }
function note(t, err){ $('msg').innerHTML = t ? '<div class="msg' + (err ? ' err' : '') + '">' + esc(t) + '</div>' : ''; }
const durasi = m => m < 60 ? m + ' mnt' : Math.floor(m/60) + ' j ' + (m%60) + ' mnt';
function logout(){ store.del(); clearInterval(timer); stopScan(); note(''); show('vLogin'); }
document.querySelectorAll('[data-logout]').forEach(b => b.onclick = logout);

async function start(){
  if (API_URL.indexOf('GANTI') === 0) return note('API_URL belum diisi di index.html.', true);
  const t = store.get();
  if (!t){ if (scanTok) note('Login dulu, lalu hasil scan kamu langsung diproses.'); return show('vLogin'); }
  try { await home(t); } catch(e){ store.del(); note(e.message, true); show('vLogin'); }
}
async function home(t){
  if (scanTok){ const g = scanTok; scanTok = ''; history.replaceState(null, '', location.pathname); await handleScan(g, true); }
  const s = await api('getStatus', t);
  if (s.role === 'admin') return MODE === 'gerbang' ? gateView(t) : adminView(t);
  mhsView(s);
}

// ---------- Mahasiswa ----------
function mhsView(s){
  show('vMhs');
  $('mNama').textContent = s.nama; $('mKamar').textContent = 'Kamar ' + s.kamar;
  $('mState').textContent = s.luar ? 'Di luar asrama' : 'Di asrama';
  $('mState').className = 'state ' + (s.luar ? 'out' : 'in');
  $('mInfo').textContent = s.luar ? 'Keluar ' + s.jam + ' · ' + s.alasan : '';
  $('fKeluar').classList.toggle('hide', !pass);
  $('fScan').classList.toggle('hide', !!pass);
  $('bScan').textContent = s.luar ? 'Scan QR untuk masuk asrama' : 'Scan QR untuk keluar asrama';
}
async function handleScan(g, skipRefresh){
  try {
    const r = await api('scan', store.get(), g);
    if (r.aksi === 'masuk') note(r.pesan); else pass = r.pass;
  } catch(e){ note(e.message, true); }
  if (!skipRefresh) mhsView(await api('getStatus', store.get()));
}
async function startScan(){
  note(''); $('scanBox').classList.remove('hide'); busy = false;
  scanner = new Html5Qrcode('reader');
  try { await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 } }, onScan, () => {}); }
  catch(e){ note('Kamera tidak bisa dibuka. Izinkan akses kamera di browser.', true); stopScan(); }
}
async function stopScan(){
  try { if (scanner){ await scanner.stop(); scanner.clear(); } } catch(e){}
  scanner = null; $('scanBox').classList.add('hide');
}
async function onScan(text){
  if (busy) return; busy = true;
  await stopScan();
  let g = ''; try { g = new URL(text).searchParams.get('s') || ''; } catch(e){}
  if (!g) return note('QR tidak dikenali. Scan QR yang tampil di pos asrama.', true);
  await handleScan(g);
}
$('bScan').onclick = startScan;
$('bStop').onclick = stopScan;
$('bKeluar').onclick = async () => {
  const b = $('bKeluar'); b.disabled = true; note('');
  try {
    note(await api('keluar', store.get(), $('alasan').value, pass)); $('alasan').value = ''; pass = '';
    mhsView(await api('getStatus', store.get()));
  } catch(e){ note(e.message, true); }
  b.disabled = false;
};

// ---------- Admin ----------
async function adminView(t){
  show('vAdmin');
  const load = async () => {
    try {
      const r = await api('adminData', t);
      const luar = r.data.filter(x => x.luar), din = r.data.filter(x => !x.luar);
      $('cLuar').textContent = luar.length; $('cIn').textContent = din.length;
      $('cTelat').textContent = luar.filter(x => x.telat).length;
      $('aInfo').textContent = 'Jam malam ' + r.jamMalam + ' · diperbarui ' + new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
      $('lLuar').innerHTML = luar.map(x =>
        '<div class="card row' + (x.telat ? ' late' : '') + '"><div><div class="nm">' + esc(x.nama) + '</div><div class="meta">Kamar ' + esc(x.kamar) + ' · ' + esc(x.alasan) + '</div>' +
        '<button class="mini" data-nim="' + esc(x.nim) + '" data-to="Di Asrama">Ubah ke Di Asrama</button></div>' +
        '<div class="rt">' + (x.telat ? 'Lewat jam malam<br>' : '') + 'keluar ' + esc(x.jam) + '<br>' + durasi(x.menit) + '</div></div>').join('') || '<p class="sub">Semua penghuni ada di asrama.</p>';
      $('lIn').innerHTML = din.map(x =>
        '<div class="card row"><div><div class="nm">' + esc(x.nama) + '</div><div class="meta">Kamar ' + esc(x.kamar) + '</div>' +
        '<button class="mini" data-nim="' + esc(x.nim) + '" data-to="Di Luar">Ubah ke Di Luar</button></div></div>').join('');
    } catch(e){ note(e.message, true); }
  };
  reload = load; await load(); clearInterval(timer); timer = setInterval(load, 30000);
}
document.body.addEventListener('click', async e => {
  const b = e.target.closest('button[data-nim]'); if (!b) return;
  if (!confirm('Ubah status menjadi ' + b.dataset.to + '? Perubahan tercatat di Log.')) return;
  try { await api('ubahManual', store.get(), b.dataset.nim, b.dataset.to); note('Status diubah.'); await reload(); }
  catch(err){ note(err.message, true); }
});

// ---------- Layar gerbang ----------
async function gateView(t){
  show('vGate'); note('');
  const draw = async () => {
    try {
      const r = await api('gateToken', t), q = $('qr'); q.innerHTML = '';
      new QRCode(q, { text: location.origin + location.pathname + '?s=' + encodeURIComponent(r.token), width: 280, height: 280, correctLevel: QRCode.CorrectLevel.L });
      $('gInfo').textContent = 'Diperbarui ' + new Date().toLocaleTimeString('id-ID');
    } catch(e){ note(e.message, true); }
  };
  await draw(); clearInterval(timer); timer = setInterval(draw, 30000);
}
$('bGate').onclick = () => gateView(store.get());
$('bBack').onclick = () => { clearInterval(timer); home(store.get()); };

// ---------- Login ----------
$('bLogin').onclick = async () => {
  const b = $('bLogin'); b.disabled = true; note('');
  try {
    const r = await api('login', $('nim').value, $('pin').value);
    store.set(r.token); $('pin').value = ''; await home(r.token);
  } catch(e){ note(e.message, true); }
  b.disabled = false;
};
start();
</script>
</body>
</html>
